<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabla Periódica de Navegación Digital - Reino de Ooo</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Fredoka & Patrick Hand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- html2pdf.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Firebase SDKs Compat CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background-color: #0f172a;
    }
    .font-hand {
      font-family: 'Patrick Hand', cursive;
    }
    .comic-box {
      border: 3px solid #000;
      box-shadow: 5px 5px 0px #000;
    }
    .comic-box-sm {
      border: 2px solid #000;
      box-shadow: 3px 3px 0px #000;
    }
    .live-dot {
      animation: pulse-green 1.5s infinite;
    }
    @keyframes pulse-green {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // CONFIGURACIÓN DE FIREBASE REALTIME DATABASE (tabla-digital-ooo)
    const firebaseConfig = {
      apiKey: "AIzaSyA6obHXJ1LjTvNJaUJViMEyXoV47n5G8yE",
      authDomain: "tabla-digital-ooo.firebaseapp.com",
      databaseURL: "https://tabla-digital-ooo-default-rtdb.firebaseio.com",
      projectId: "tabla-digital-ooo",
      storageBucket: "tabla-digital-ooo.firebasestorage.app",
      messagingSenderId: "482088126201",
      appId: "1:482088126201:web:460f989c89de7f09d78428",
      measurementId: "G-FFDEK9DZN9"
    };

    let rtdb = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      rtdb = firebase.database();
    } catch (e) {
      console.warn("Modo local activado:", e);
    }

    const INITIAL_RUNES = [
      { id: 'At', symbol: '⬅️', name: 'Atrás', cat: 'NAV', desc: 'Regresa a la página o sección anterior.', tip: 'Úsalo si entraste a un enlace equivocado.', oracle: 'El hilo de Ariadna que te desanda en el ciberespacio.' },
      { id: 'Ca', symbol: '🔒', name: 'Seguro', cat: 'SEG', desc: 'Indica conexión cifrada y privada.', tip: 'Verifica este icono antes de colocar claves o datos.', oracle: 'Un escudo de cristal inviolable ante los dragones digitales.' },
      { id: 'Bu', symbol: '🔍', name: 'Buscar', cat: 'NAV', desc: 'Abre la caja para encontrar información.', tip: 'Usa palabras clave cortas y precisas.', oracle: 'El ojo sabio del Búho Cósmico que rastrea el conocimiento.' },
      { id: 'De', symbol: '📥', name: 'Bajar', cat: 'ACC', desc: 'Guarda archivos en tu computadora.', tip: 'Revisa tu carpeta de Descargas tras presionar.', oracle: 'Invoca un tesoro desde la nube hacia tu cofre privado.' },
      { id: 'Gl', symbol: '🌐', name: 'Web', cat: 'COM', desc: 'Red mundial interconectada.', tip: 'Navega con atención y respeto.', oracle: 'Un tapiz mágico que une todas las aldeas del reino de Ooo.' }
    ];

    const CATEGORIES = {
      NAV: { name: 'Navegación', bg: 'bg-sky-400', border: 'border-sky-600', text: 'text-sky-950' },
      ACC: { name: 'Acciones', bg: 'bg-emerald-400', border: 'border-emerald-600', text: 'text-emerald-950' },
      SEG: { name: 'Seguridad', bg: 'bg-rose-400', border: 'border-rose-600', text: 'text-rose-950' },
      COM: { name: 'Social', bg: 'bg-purple-400', border: 'border-purple-600', text: 'text-purple-950' },
    };

    function App() {
      const [view, setView] = useState('home'); // home, table, mural, forge, checklist, pdf
      const [studentInfo, setStudentInfo] = useState({ name: '', course: '1ME' });
      const [runes, setRunes] = useState(INITIAL_RUNES);
      const [selectedRune, setSelectedRune] = useState(null);
      const [showOracle, setShowOracle] = useState(false);
      
      const [muralMessages, setMuralMessages] = useState([]);
      const [newMessageText, setNewMessageText] = useState('');
      const [isOnlineDB, setIsOnlineDB] = useState(false);

      // Metacognición (Checklist)
      const [metaCheck, setMetaCheck] = useState({ c1: false, c2: false, c3: false, c4: false });

      // Forjador
      const [newRune, setNewRune] = useState({ id: '', name: '', cat: 'NAV', desc: '', tip: '', oracle: '', symbol: '✨' });

      // Sincronización en tiempo real con Realtime Database
      useEffect(() => {
        if (rtdb) {
          setIsOnlineDB(true);

          // Escuchar Muro
          const muralRef = rtdb.ref('mural_de_debates');
          muralRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
              const loaded = Object.keys(data).map(key => ({ id: key, ...data[key] }));
              setMuralMessages(loaded.reverse());
            } else {
              setMuralMessages([]);
            }
          });

          // Escuchar Runas forjadas
          const runesRef = rtdb.ref('runas_forjadas');
          runesRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
              const custom = Object.keys(data).map(key => ({ id: key, ...data[key] }));
              setRunes([...INITIAL_RUNES, ...custom]);
            } else {
              setRunes(INITIAL_RUNES);
            }
          });

          return () => {
            muralRef.off();
            runesRef.off();
          };
        } else {
          const localRunes = localStorage.getItem('tabla_runas_local');
          if (localRunes) setRunes(JSON.parse(localRunes));
        }
      }, []);

      const handlePostMessage = (e) => {
        e.preventDefault();
        if (!newMessageText.trim()) return;

        const msgData = {
          author: studentInfo.name || 'Héroe Anónimo',
          course: studentInfo.course,
          text: newMessageText,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        if (rtdb) {
          rtdb.ref('mural_de_debates').push(msgData);
        } else {
          setMuralMessages([msgData, ...muralMessages]);
        }
        setNewMessageText('');
      };

      const handleForgeRune = (e) => {
        e.preventDefault();
        const forged = {
          ...newRune,
          id: newRune.id || newRune.name.substring(0, 2).toUpperCase(),
          isCustom: true
        };

        if (rtdb) {
          rtdb.ref('runas_forjadas').push(forged);
        } else {
          const updated = [...runes, forged];
          setRunes(updated);
          localStorage.setItem('tabla_runas_local', JSON.stringify(updated));
        }

        setNewRune({ id: '', name: '', cat: 'NAV', desc: '', tip: '', oracle: '', symbol: '✨' });
        setView('table');
      };

      const handleDownloadPDF = () => {
        const element = document.getElementById('pdf-container');
        const opt = {
          margin: 0.5,
          filename: `Expediente_${studentInfo.name || 'Estudiante'}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, scrollY: 0, scrollX: 0 },
          jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
      };

      // Cálculo de Nivel de Héroe
      const exploredCount = runes.length;
      const heroLevel = exploredCount >= 10 ? 'Maestro Cósmico' : exploredCount >= 7 ? 'Caballero de Ooo' : exploredCount >= 5 ? 'Explorador Ágil' : 'Aprendiz del Reino';

      return (
        <div className="min-h-screen text-slate-100 p-4 md:p-8">
          
          {/* BARRA DE NAVEGACIÓN Y BREADCRUMBS */}
          <header className="max-w-5xl mx-auto mb-6 no-print space-y-3">
            <div className="bg-amber-300 text-black p-4 rounded-2xl comic-box flex flex-col md:flex-row justify-between items-center gap-4">
              <div>
                <span className="text-xs font-black uppercase bg-black text-white px-2 py-0.5 rounded flex items-center gap-1 w-fit">
                  <span className="w-2 h-2 rounded-full live-dot bg-green-400"></span>
                  {isOnlineDB ? '⚡ FIREBASE TIEMPO REAL ACTIVO' : '💾 MODO LOCAL'}
                </span>
                <h1 className="text-3xl font-black tracking-tight uppercase mt-1">TABLA PERIÓDICA DIGITAL</h1>
              </div>

              <div className="flex flex-wrap gap-2 items-center">
                <input 
                  type="text" 
                  placeholder="Tu Nombre..." 
                  value={studentInfo.name} 
                  onChange={e => setStudentInfo({ ...studentInfo, name: e.target.value })}
                  className="p-2 border-2 border-black rounded-xl text-sm font-bold text-black focus:outline-none"
                />
                <select 
                  value={studentInfo.course} 
                  onChange={e => setStudentInfo({ ...studentInfo, course: e.target.value })}
                  className="p-2 border-2 border-black rounded-xl text-sm font-bold text-black focus:outline-none"
                >
                  {['5˚D', '5˚C', '6˚C', '6˚D', '6˚E', '7˚D', '7˚C', '8˚D', '8˚C', '1ME', '1MF', '2ME', '2MF'].map(c => (
                    <option key={c} value={c}>{c}</option>
                  ))}
                </select>
              </div>
            </div>

            {/* Breadcrumbs de Ubicación */}
            <div className="text-xs font-bold text-amber-300 bg-slate-900 px-4 py-2 rounded-xl comic-box-sm flex justify-between items-center">
              <span>📍 Reino de Ooo &gt; Módulo &gt; <span className="uppercase text-white underline">{view}</span></span>
              <span>🛡️ Rango: <strong>{heroLevel}</strong> ({exploredCount} Runas)</span>
            </div>

            {/* Pestañas de Interacción */}
            <nav className="flex flex-wrap gap-2">
              <button onClick={() => setView('home')} className={`px-4 py-2 font-bold rounded-xl comic-box-sm transition-all ${view === 'home' ? 'bg-amber-400 text-black' : 'bg-slate-800'}`}>🏠 INICIO</button>
              <button onClick={() => setView('table')} className={`px-4 py-2 font-bold rounded-xl comic-box-sm transition-all ${view === 'table' ? 'bg-sky-400 text-black' : 'bg-slate-800'}`}>🧪 TABLA</button>
              <button onClick={() => setView('mural')} className={`px-4 py-2 font-bold rounded-xl comic-box-sm transition-all ${view === 'mural' ? 'bg-purple-400 text-black' : 'bg-slate-800'}`}>💬 MURO EN VIVO</button>
              <button onClick={() => setView('forge')} className={`px-4 py-2 font-bold rounded-xl comic-box-sm transition-all ${view === 'forge' ? 'bg-emerald-400 text-black' : 'bg-slate-800'}`}>🔨 FORJAR</button>
              <button onClick={() => setView('checklist')} className={`px-4 py-2 font-bold rounded-xl comic-box-sm transition-all ${view === 'checklist' ? 'bg-indigo-400 text-black' : 'bg-slate-800'}`}>📋 METACOGNICIÓN</button>
              <button onClick={() => setView('pdf')} className={`px-4 py-2 font-bold rounded-xl comic-box-sm transition-all ${view === 'pdf' ? 'bg-rose-400 text-black' : 'bg-slate-800'}`}>📄 EXPEDIENTE</button>
            </nav>
          </header>

          {/* VISTA 1: INICIO Y OBJETIVOS */}
          {view === 'home' && (
            <main className="max-w-4xl mx-auto bg-slate-900 border-4 border-amber-400 p-8 rounded-3xl comic-box space-y-6">
              <h2 className="text-3xl font-black text-amber-300">¡AVENTURA DIGITAL EN EL REINO DE OOO! 🗡️</h2>
              <p className="text-lg leading-relaxed">
                <strong>Objetivo de Aprendizaje:</strong> El estudiante será capaz de identificar, clasificar y explicar la función técnica y ética de los iconos de navegación digital utilizando recursos metafóricos y trabajo colaborativo sincrónico.
              </p>
              
              <div className="grid md:grid-cols-2 gap-4 text-slate-900 font-bold">
                <div className="bg-sky-300 p-4 rounded-2xl comic-box-sm">
                  1. Explora la Tabla de Runas y descubre los secretos del Oráculo.
                </div>
                <div className="bg-purple-300 p-4 rounded-2xl comic-box-sm">
                  2. Debate en tiempo real con tus compañeros en el Muro de la Dulce Academia.
                </div>
                <div className="bg-emerald-300 p-4 rounded-2xl comic-box-sm">
                  3. Forja nuevas runas y compártelas de inmediato con toda la clase.
                </div>
                <div className="bg-rose-300 p-4 rounded-2xl comic-box-sm">
                  4. Completa tu pauta metacognitiva y exporta tu Expediente PDF con Rúbrica.
                </div>
              </div>

              <button onClick={() => setView('table')} className="w-full py-4 bg-amber-400 text-black font-black text-xl rounded-2xl comic-box hover:bg-amber-300 transition-all">
                ¡COMENZAR MISIÓN! 🚀
              </button>
            </main>
          )}

          {/* VISTA 2: TABLA PERIÓDICA */}
          {view === 'table' && (
            <main className="max-w-5xl mx-auto space-y-6">
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
                {runes.map((r, i) => {
                  const cat = CATEGORIES[r.cat] || CATEGORIES.NAV;
                  return (
                    <button 
                      key={i} 
                      onClick={() => { setSelectedRune(r); setShowOracle(false); }}
                      className={`${cat.bg} ${cat.border} ${cat.text} p-4 rounded-2xl comic-box aspect-square flex flex-col justify-between items-center hover:-translate-y-1 transition-all active:scale-95`}
                    >
                      <span className="self-start text-xs font-black bg-black text-white px-1.5 py-0.5 rounded">{r.id}</span>
                      <span className="text-4xl">{r.symbol}</span>
                      <span className="text-sm font-black uppercase">{r.name}</span>
                    </button>
                  );
                })}
              </div>
            </main>
          )}

          {/* MODAL DE DETALLE Y ORÁCULO */}
          {selectedRune && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border-4 border-amber-400 w-full max-w-md rounded-3xl p-6 comic-box text-white space-y-4">
                <div className="flex justify-between items-center border-b border-slate-700 pb-2">
                  <span className="text-2xl font-black text-amber-300">[{selectedRune.id}] {selectedRune.name}</span>
                  <button onClick={() => setSelectedRune(null)} className="font-black text-xl bg-rose-500 text-white px-3 py-1 rounded-xl comic-box-sm">X</button>
                </div>

                {!showOracle ? (
                  <div className="space-y-3">
                    <div className="text-6xl text-center my-4">{selectedRune.symbol}</div>
                    <p className="text-lg"><strong>Función:</strong> {selectedRune.desc}</p>
                    <p className="text-sm text-amber-300 italic"><strong>Consejo:</strong> "{selectedRune.tip}"</p>
                    <button 
                      onClick={() => setShowOracle(true)}
                      className="w-full py-3 bg-indigo-600 font-bold rounded-xl comic-box-sm hover:bg-indigo-500 transition-all"
                    >
                      🔮 CONSULTAR AL ORÁCULO DEL BÚHO CÓSMICO
                    </button>
                  </div>
                ) : (
                  <div className="space-y-4 bg-indigo-950 p-4 rounded-2xl border border-indigo-700">
                    <h3 className="text-amber-300 font-black text-center">REVELACIÓN METAFÓRICA</h3>
                    <p className="font-hand text-2xl text-center italic leading-relaxed">"{selectedRune.oracle}"</p>
                    <button onClick={() => setShowOracle(false)} className="w-full py-2 bg-slate-800 text-xs font-bold rounded-xl">Volver a detalles</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* VISTA 3: MURO EN VIVO */}
          {view === 'mural' && (
            <main className="max-w-3xl mx-auto bg-slate-900 border-4 border-purple-400 p-6 rounded-3xl comic-box space-y-6">
              <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                <h2 className="text-2xl font-black text-purple-300 flex items-center gap-2">
                  <span className="w-3 h-3 bg-green-500 rounded-full live-dot"></span>
                  BUZÓN DE LA DULCE ACADEMIA (EN VIVO)
                </h2>
              </div>

              <form onSubmit={handlePostMessage} className="flex gap-2">
                <input 
                  type="text" 
                  placeholder="Comparte un consejo de ciberseguridad con la clase..." 
                  value={newMessageText} 
                  onChange={e => setNewMessageText(e.target.value)}
                  className="flex-1 p-3 border-2 border-black rounded-xl text-black font-bold focus:outline-none"
                />
                <button type="submit" className="bg-purple-400 text-black font-black px-6 py-3 rounded-xl comic-box-sm hover:bg-purple-300">
                  PUBLICAR ⚡
                </button>
              </form>

              <div className="space-y-3 max-h-96 overflow-y-auto p-2">
                {muralMessages.map((msg, i) => (
                  <div key={i} className="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-1">
                    <div className="flex justify-between text-xs text-purple-300 font-bold">
                      <span>👤 {msg.author} ({msg.course})</span>
                      <span>⏱️ {msg.timestamp}</span>
                    </div>
                    <p className="text-sm text-slate-200">{msg.text}</p>
                  </div>
                ))}
              </div>
            </main>
          )}

          {/* VISTA 4: FORJADOR DE RUNAS */}
          {view === 'forge' && (
            <main className="max-w-xl mx-auto bg-slate-900 border-4 border-emerald-400 p-6 rounded-3xl comic-box space-y-4">
              <h2 className="text-2xl font-black text-emerald-300">FORJAR NUEVO ICONO DIGITAL</h2>
              <form onSubmit={handleForgeRune} className="space-y-4">
                <div>
                  <label className="text-xs font-bold text-slate-400">Nombre del Icono</label>
                  <input 
                    required 
                    value={newRune.name} 
                    onChange={e => setNewRune({ ...newRune, name: e.target.value })} 
                    className="w-full p-2 border-2 border-black rounded-xl text-black font-bold" 
                    placeholder="Ej: Marcadores / Favoritos" 
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-400">Categoría</label>
                  <select 
                    value={newRune.cat} 
                    onChange={e => setNewRune({ ...newRune, cat: e.target.value })} 
                    className="w-full p-2 border-2 border-black rounded-xl text-black font-bold"
                  >
                    {Object.entries(CATEGORIES).map(([k, v]) => <option key={k} value={k}>{v.name}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-400">Función Técnica</label>
                  <textarea 
                    required 
                    value={newRune.desc} 
                    onChange={e => setNewRune({ ...newRune, desc: e.target.value })} 
                    className="w-full p-2 border-2 border-black rounded-xl text-black font-bold h-16 text-sm" 
                    placeholder="¿Para qué sirve este icono?" 
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-400">Metáfora del Oráculo</label>
                  <textarea 
                    required 
                    value={newRune.oracle} 
                    onChange={e => setNewRune({ ...newRune, oracle: e.target.value })} 
                    className="w-full p-2 border-2 border-black rounded-xl text-black font-bold h-16 text-sm font-hand text-base" 
                    placeholder="Escribe la versión mística/relato..." 
                  />
                </div>
                <button type="submit" className="w-full py-3 bg-emerald-400 text-black font-black rounded-xl comic-box">
                  FORJAR Y COMPARTIR EN TIEMPO REAL 🔨
                </button>
              </form>
            </main>
          )}

          {/* VISTA 5: AUTOEVALUACIÓN METACOGNITIVA */}
          {view === 'checklist' && (
            <main className="max-w-xl mx-auto bg-slate-900 border-4 border-indigo-400 p-6 rounded-3xl comic-box space-y-4">
              <h2 className="text-2xl font-black text-indigo-300">LISTA DE VERIFICACIÓN METACOGNITIVA</h2>
              <p className="text-xs text-slate-300">Evalúa tu propio aprendizaje antes de emitir tu expediente oficial:</p>
              
              <div className="space-y-3 font-bold text-sm">
                <label className="flex items-center gap-3 bg-slate-800 p-3 rounded-xl cursor-pointer border border-slate-700">
                  <input type="checkbox" checked={metaCheck.c1} onChange={e => setMetaCheck({...metaCheck, c1: e.target.checked})} className="w-5 h-5 accent-indigo-400" />
                  <span>Comprendo la diferencia entre navegación, seguridad y acciones.</span>
                </label>
                <label className="flex items-center gap-3 bg-slate-800 p-3 rounded-xl cursor-pointer border border-slate-700">
                  <input type="checkbox" checked={metaCheck.c2} onChange={e => setMetaCheck({...metaCheck, c2: e.target.checked})} className="w-5 h-5 accent-indigo-400" />
                  <span>Reconozco la importancia de verificar el icono de seguridad (🔒).</span>
                </label>
                <label className="flex items-center gap-3 bg-slate-800 p-3 rounded-xl cursor-pointer border border-slate-700">
                  <input type="checkbox" checked={metaCheck.c3} onChange={e => setMetaCheck({...metaCheck, c3: e.target.checked})} className="w-5 h-5 accent-indigo-400" />
                  <span>Participé activamente en el Muro colaborativo de la clase.</span>
                </label>
                <label className="flex items-center gap-3 bg-slate-800 p-3 rounded-xl cursor-pointer border border-slate-700">
                  <input type="checkbox" checked={metaCheck.c4} onChange={e => setMetaCheck({...metaCheck, c4: e.target.checked})} className="w-5 h-5 accent-indigo-400" />
                  <span>Forjé al menos una runa original para el conocimiento común.</span>
                </label>
              </div>

              <div className="text-center pt-2">
                <button onClick={() => setView('pdf')} className="py-3 px-6 bg-indigo-400 text-black font-black rounded-xl comic-box">
                  ¡IR AL EXPEDIENTE FINAL! 📄
                </button>
              </div>
            </main>
          )}

          {/* VISTA 6: EXPEDIENTE PDF */}
          {view === 'pdf' && (
            <main className="max-w-3xl mx-auto space-y-6">
              <div className="bg-slate-900 border-4 border-rose-400 p-6 rounded-3xl comic-box text-center space-y-4">
                <h2 className="text-2xl font-black text-rose-300">REPORTE FINAL DEL ESTUDIANTE</h2>
                <p className="text-sm text-slate-300">Descarga tu expediente oficial con las runas descubiertas, forjadas y tu autoevaluación.</p>
                <button onClick={handleDownloadPDF} className="py-4 px-8 bg-rose-400 text-black font-black text-lg rounded-2xl comic-box hover:bg-rose-300 transition-all">
                  📥 DESCARGAR INFORME EN PDF
                </button>
              </div>

              <div className="bg-white text-black p-6 rounded-2xl comic-box space-y-4 font-sans text-xs">
                <h3 className="font-bold text-lg border-b pb-2">EXPEDIENTE DE APRESTO DIGITAL</h3>
                <p><strong>Estudiante:</strong> {studentInfo.name || 'Sin Nombre'}</p>
                <p><strong>Curso:</strong> {studentInfo.course}</p>
                <p><strong>Rango Obtenido:</strong> {heroLevel}</p>
                <p><strong>Fecha:</strong> {new Date().toLocaleDateString()}</p>
                <p><strong>Total Runas Dominadas:</strong> {runes.length}</p>
              </div>
            </main>
          )}

          {/* CONTENEDOR OCULTO PARA CAPTURA HTML2PDF DE ALTA FIDELIDAD */}
          <div style={{ position: 'absolute', top: 0, left: 0, height: 0, overflow: 'hidden', pointerEvents: 'none' }}>
            <div id="pdf-container" style={{ width: '720px' }} className="p-8 bg-white text-black font-sans space-y-6">
              <div className="border-b-4 border-black pb-4">
                <h1 className="text-2xl font-black uppercase">EXPEDIENTE OFICIAL DE APRESTO DIGITAL</h1>
                <p className="text-xs text-slate-600">Reporte Académico de Navegación y Simbología Web — Reino de Ooo</p>
                <div className="grid grid-cols-2 text-xs mt-4 pt-2 border-t border-slate-300">
                  <p><strong>Estudiante:</strong> {studentInfo.name || 'Sin Registrar'}</p>
                  <p><strong>Curso:</strong> {studentInfo.course}</p>
                  <p><strong>Rango:</strong> {heroLevel}</p>
                  <p><strong>Fecha:</strong> {new Date().toLocaleDateString()}</p>
                </div>
              </div>

              <div className="space-y-4">
                <h2 className="font-bold text-sm uppercase border-b pb-1">I. Runas Exploradas y Forjadas ({runes.length})</h2>
                {runes.map((r, i) => (
                  <div key={i} style={{ pageBreakInside: 'avoid', breakInside: 'avoid' }} className="border border-slate-300 p-3 rounded bg-slate-50">
                    <p className="font-bold text-xs">[{r.id}] {r.name} — <span className="font-normal uppercase">{CATEGORIES[r.cat]?.name}</span></p>
                    <p className="text-[11px] mt-1"><strong>Función:</strong> {r.desc}</p>
                    <p className="text-[11px] italic mt-1 text-slate-700"><strong>Oráculo:</strong> "{r.oracle}"</p>
                  </div>
                ))}
              </div>

              {/* RÚBRICA DOCENTE (PAUTA DE COTEJO) AL FINAL DEL PDF */}
              <div style={{ pageBreakInside: 'avoid', breakInside: 'avoid' }} className="mt-8 pt-4 border-t-2 border-black space-y-2">
                <h3 className="font-bold text-xs uppercase">II. Rúbrica de Evaluación Docente (Pauta de Cotejo)</h3>
                <table className="w-full text-[10px] border-collapse border border-slate-400">
                  <thead>
                    <tr className="bg-slate-200">
                      <th className="border border-slate-400 p-1 text-left">Criterio de Evaluación</th>
                      <th className="border border-slate-400 p-1 w-16 text-center">Logrado</th>
                      <th className="border border-slate-400 p-1 w-20 text-center">Por Mejorar</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td className="border border-slate-400 p-1">Identifica correctamente las runas de navegación básica y seguridad.</td>
                      <td className="border border-slate-400 p-1 text-center">🔲</td>
                      <td className="border border-slate-400 p-1 text-center">🔲</td>
                    </tr>
                    <tr>
                      <td className="border border-slate-400 p-1">Participa activamente en el Muro colaborativo sincrónico.</td>
                      <td className="border border-slate-400 p-1 text-center">🔲</td>
                      <td className="border border-slate-400 p-1 text-center">🔲</td>
                    </tr>
                    <tr>
                      <td className="border border-slate-400 p-1">Completa la autoevaluación metacognitiva y genera su expediente.</td>
                      <td className="border border-slate-400 p-1 text-center">🔲</td>
                      <td className="border border-slate-400 p-1 text-center">🔲</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
